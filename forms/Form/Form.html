<html>
<head>
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css"/>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
</head>
<body>
<div class="fluig-style-guide">
<form name="form" role="form">

	<div class="page-header">
		<h2>Solicitação de Hospedagem</h2>
	</div>

	<!-- Dados do funcionário -->
	<div class="panel panel-default">
		<div class="panel-heading">
			<h3 class="panel-title">Dados do Funcionário</h3>
		</div>
		<div class="panel-body">
			<div class="row">
				<div class="form-group col-md-8">
					<label for="nomeFuncionario">Nome do funcionário <span class="text-danger">*</span></label>
					<input type="text" class="form-control" id="nomeFuncionario" name="nomeFuncionario">
				</div>
				<div class="form-group col-md-4">
					<label for="matricula">Matrícula <span class="text-danger">*</span></label>
					<input type="text" class="form-control" id="matricula" name="matricula">
				</div>
			</div>
			<div class="row">
				<div class="form-group col-md-6">
					<label for="departamento">Departamento <span class="text-danger">*</span></label>
					<select class="form-control" id="departamento" name="departamento">
						<option value="">Selecione...</option>
						<option value="Comercial">Comercial</option>
						<option value="Implantação">Implantação</option>
						<option value="Suporte">Suporte</option>
						<option value="Desenvolvimento">Desenvolvimento</option>
						<option value="Financeiro">Financeiro</option>
						<option value="Recursos Humanos">Recursos Humanos</option>
						<option value="Diretoria">Diretoria</option>
					</select>
				</div>
				<div class="form-group col-md-6">
					<label for="centroCusto">Centro de custo <span class="text-danger">*</span></label>
					<select class="form-control" id="centroCusto" name="centroCusto">
						<option value="">Selecione...</option>
						<option value="1001">1001 - Comercial</option>
						<option value="1002">1002 - Implantação</option>
						<option value="1003">1003 - Suporte</option>
						<option value="1004">1004 - Desenvolvimento</option>
						<option value="1005">1005 - Administrativo</option>
					</select>
				</div>
			</div>
		</div>
	</div>

	<!-- Dados da viagem -->
	<div class="panel panel-default">
		<div class="panel-heading">
			<h3 class="panel-title">Dados da Viagem</h3>
		</div>
		<div class="panel-body">
			<div class="row">
				<div class="form-group col-md-12">
					<label for="cidadeDestino">Cidade de destino <span class="text-danger">*</span></label>
					<input type="text" class="form-control" id="cidadeDestino" name="cidadeDestino">
				</div>
			</div>
			<div class="row">
				<div class="form-group col-md-12">
					<label for="motivoViagem">Motivo da viagem <span class="text-danger">*</span></label>
					<textarea class="form-control" id="motivoViagem" name="motivoViagem" rows="3"></textarea>
				</div>
			</div>
		</div>
	</div>

	<!-- Dados da hospedagem -->
	<div class="panel panel-default">
		<div class="panel-heading">
			<h3 class="panel-title">Hospedagem</h3>
		</div>
		<div class="panel-body">
			<div class="row">
				<div class="form-group col-md-4">
					<label for="dataEntrada">Data de entrada <span class="text-danger">*</span></label>
					<input type="date" class="form-control" id="dataEntrada" name="dataEntrada">
				</div>
				<div class="form-group col-md-4">
					<label for="dataSaida">Data de saída <span class="text-danger">*</span></label>
					<input type="date" class="form-control" id="dataSaida" name="dataSaida">
				</div>
				<div class="form-group col-md-4">
					<label for="qtdHospedes">Quantidade de hóspedes <span class="text-danger">*</span></label>
					<input type="number" class="form-control" id="qtdHospedes" name="qtdHospedes" min="1" step="1">
				</div>
			</div>
			<div class="row">
				<div class="form-group col-md-4">
					<label for="valorDiaria">Valor estimado da diária <span class="text-danger">*</span></label>
					<div class="input-group">
						<span class="input-group-addon">R$</span>
						<input type="text" class="form-control" id="valorDiaria" name="valorDiaria" placeholder="0,00">
					</div>
				</div>
				<div class="form-group col-md-4">
					<label for="qtdDiarias">Quantidade de diárias</label>
					<input type="text" class="form-control" id="qtdDiarias" name="qtdDiarias" readonly>
				</div>
				<div class="form-group col-md-4">
					<label for="custoTotal">Custo estimado total</label>
					<div class="input-group">
						<span class="input-group-addon">R$</span>
						<input type="text" class="form-control" id="custoTotal" name="custoTotal" readonly>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Observações -->
	<div class="panel panel-default">
		<div class="panel-heading">
			<h3 class="panel-title">Observações</h3>
		</div>
		<div class="panel-body">
			<div class="row">
				<div class="form-group col-md-12">
					<label for="observacoes">Observações</label>
					<textarea class="form-control" id="observacoes" name="observacoes" rows="4"></textarea>
				</div>
			</div>
		</div>
	</div>

</form>
</div>
</body>
</html>
